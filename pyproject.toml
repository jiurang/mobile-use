[project]
name = "minitap-mobile-use"
version = "4.0.0"
description = "AI-powered multi-agent system that automates real Android and iOS devices through low-level control using LangGraph."
readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Pierre-Louis Favreau" },
    { name = "Jean-Pierre Lo" },
    { name = "Nicolas Dehandschoewercker" },
]

requires-python = ">=3.12"

dependencies = [
    # Capped to a minor: ExecutorToolNode subclasses langgraph-prebuilt's ToolNode private API,
    # which changes in minor releases (see #213). Bump deliberately; tests/mobile_use/test_executor_tool_node.py guards it.
    "langgraph>=1.2.0,<1.3.0",
    "adbutils==2.9.3",
    "langchain-google-genai>=4.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "jinja2==3.1.6",
    "python-dotenv==1.1.1",
    "pydantic-settings==2.10.1",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "typer==0.16.0",
    "textual>=8.2.8,<9.0.0",
    # PIL is imported directly by controllers/sdk (and by the TUI screenshot panel),
    # but was only ever pulled in transitively.
    "pillow>=11.0.0",
    "langchain-cerebras>=0.8.0",
    "inquirer>=3.4.0",
    "sseclient-py>=1.8.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "colorama>=0.4.6",
    "psutil>=5.9.0",
    "langchain-google-vertexai>=3.0.0",
    "httpx>=0.28.1",
    "uiautomator2>=3.5.0",
    "fb-idb>=1.1.7",
    "facebook-wda>=1.5.4",
    "Appium-Python-Client>=5.0.0",
    "posthog>=7.4.2",
    "uuid-utils>=0.12.0",
    "limrun-api>=0.1.0",
    "websockets>=12.0",
    "langchain-azure-ai>=1.1.1",
]

[project.optional-dependencies]
# OCR 感知。刻意不放在主依赖里：onnxruntime + opencv 是两个重包，
# 而 OCR 感知有开关，不需要它的使用者不必背这份安装成本。
# pyclipper 必须锁 1.4.x —— 1.3.0 在 Windows / Python 3.12 没有 wheel，
# 会退化成源码编译并失败（实测 cl.exe 编译报错）。
ocr = [
    "onnxruntime>=1.18.0",
    "opencv-python-headless>=4.9.0",
    "pyclipper>=1.4.0,<1.5.0",
]
# OCR 走 GPU。**和 [ocr] 互斥，不能同时装** —— onnxruntime / onnxruntime-gpu
# 提供同一个 `onnxruntime` 模块，装在一起会互相覆盖文件。
#
# 版本必须和本机 CUDA 大版本配套，锁 1.19~1.22（CUDA 12 系列）：
# 1.23+ 起要 CUDA 13，报 `cublasLt64_13.dll` 缺失。装完还要有 cudart /
# cublas / cublasLt / cufft / cudnn 的 dll，路径给 MOBILE_USE_CUDA_DLL_DIR
# （完整装了 CUDA Toolkit 的机器不用设，靠 PATH）。
ocr-gpu = [
    "onnxruntime-gpu>=1.19.0,<1.23.0",
    "opencv-python-headless>=4.9.0",
    "pyclipper>=1.4.0,<1.5.0",
]
# Windows 上的 DirectML 后端。同样和 [ocr] / [ocr-gpu] 互斥。
# 实测它比 CPU 慢（见 paddle_onnx 模块 docstring），所以 `device=auto` 不会选它，
# 只有显式 `device="dml"` 才会用。
ocr-dml = [
    "onnxruntime-directml>=1.20.0",
    "opencv-python-headless>=4.9.0",
    "pyclipper>=1.4.0,<1.5.0",
]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.405"
]

[project.scripts]
mobile-use = "minitap.mobile_use.main:cli"
mobile-use-tui = "minitap.mobile_use.tui.cli:cli"

[project.urls]
"Homepage" = "https://minitap.ai/"
"Source" = "https://github.com/minitap-ai/mobile-use"

[build-system]
requires = ["uv_build>=0.7.20,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "minitap.mobile_use"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Also enable TID (flake8-tidy-imports) to enforce absolute imports
select = ["E", "F", "TID", "UP"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports
ban-relative-imports = "all"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
# Add project root to Python path for absolute imports
pythonpath = [
    "."
]
# Specify test discovery patterns
testpaths = [
    "minitap",
    "tests"
]
python_files = [
    "*.test.py",
    "test_*.py",
    "*_test.py"
]
python_functions = [
    "test_*"
]
python_classes = [
    "Test*"
]
# Add useful options
addopts = [
    "-v",                    # verbose output
    "--tb=short",           # shorter traceback format
    "--strict-markers",     # strict marker checking
    "--disable-warnings",   # disable warnings for cleaner output
]

markers = [
    "ios_simulator: tests requiring iOS simulator (run on macOS with IDB)",
    "android: tests requiring Android device or emulator",
    "integration: tests making real external API calls (require provider credentials)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.389",
    "pre-commit>=3.5.0",
]
