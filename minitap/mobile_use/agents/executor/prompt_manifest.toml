# Executor 的提示词清单。
#
# 目录约定：
#   prompts/en/<file>  英文原版
#   prompts/zh/<file>  中文版（与 en/ 完全同构，同名文件）
# 下面的 file 一律写「不带语言」的相对路径，渲染时按当前语言拼成
# prompts/<lang>/<file>。zh 缺某一段时只回落这一段到 en，并 warning。
#
# 两条车道，语义不同，不要混：
#
#   [[system]]  稳定指令 -> SystemMessage。整场运行逐字节稳定，才吃得到前缀缓存。
#   [[message]] 运行时块 -> HumanMessage。顺序由 prompt.build_executor_messages
#               显式决定（越靠后，越晚失效）；这里的 file / volatility 只描述
#               「它是什么、多久变一次」，不参与排序。
#
# 约定：
#   - system 段的文本只做 `{{var}}` 插值；条件和派生数据留在 prompt.py。
#   - `when` 由 Python 传入的布尔值决定这一段是否参与组装。
#   - message 的目录名与 volatility 同名：messages/<volatility>/<name>.md。

[[system]]
name = "identity"
order = -100
file = "system/00-identity.md"

[[system]]
name = "rules"
order = 10
file = "system/10-rules.md"

[[system]]
name = "tools"
order = 30
file = "system/30-tools.md"

[[system]]
name = "output"
order = 40
file = "system/40-output.md"

# --- 运行时消息块 ---------------------------------------------------------
# volatility（名字与目录同名：messages/<volatility>/<name>.md）：
#   per-turn          整场运行不变（任务开始时间）
#   per-agent-session 一个局部上下文域内不变（目标陈述；换目标 = 换会话）
#   per-step          每步重建（设备状态 / 元素表 / 视觉主体）
#   occasional        偶发（拒绝 / 重试 / 丢弃动作 / 停滞提醒）
#   terminal          收尾（步数上限 / 无目标 / done / failed）

[[message]]
name = "task_started"
file = "messages/per-turn/task-started.md"
volatility = "per-turn"

[[message]]
name = "goal"
file = "messages/per-agent-session/goal.md"
volatility = "per-agent-session"

[[message]]
name = "device_state"
file = "messages/per-step/device-state.md"
volatility = "per-step"

[[message]]
name = "screen_elements"
file = "messages/per-step/screen-elements.md"
volatility = "per-step"

[[message]]
name = "vision_subjects"
file = "messages/per-step/vision-subjects.md"
volatility = "per-step"

# occasional 的四块是同一类「反馈」，共享一个模板文件；
# 渲染时用 `block` 选择其中一段（见 prompt.py 的 render_* 函数）。
[[message]]
name = "dispatch_rejection"
file = "messages/occasional/feedback.md"
volatility = "occasional"

[[message]]
name = "retry"
file = "messages/occasional/feedback.md"
volatility = "occasional"

[[message]]
name = "extra_actions"
file = "messages/occasional/feedback.md"
volatility = "occasional"

[[message]]
name = "stall_notice"
file = "messages/occasional/feedback.md"
volatility = "occasional"

[[message]]
name = "step_limit"
file = "messages/terminal/step-limit.md"
volatility = "terminal"

[[message]]
name = "no_goal"
file = "messages/terminal/no-goal.md"
volatility = "terminal"

[[message]]
name = "done_fallback"
file = "messages/terminal/done-fallback.md"
volatility = "terminal"

[[message]]
name = "failed_fallback"
file = "messages/terminal/failed-fallback.md"
volatility = "terminal"
